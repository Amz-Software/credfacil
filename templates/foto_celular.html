<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Foto</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 1.3rem; color: #1a1a1a; margin-bottom: 8px; }
    p { color: #666; font-size: .95rem; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn:active { opacity: .8; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
    #preview {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 16px;
      display: none;
      max-height: 320px;
      object-fit: contain;
      image-orientation: from-image;
    }
    #status {
      font-size: .9rem;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      display: none;
    }
    .status-ok { background: #d1fae5; color: #065f46; }
    .status-erro { background: #fee2e2; color: #991b1b; }
    input[type=file] { display: none; }
  </style>
</head>
<body>
  <div class="card">

    {% if expirada %}
      <div class="icon">⏰</div>
      <h1>Sessão expirada</h1>
      <p>O tempo para envio da foto esgotou.<br>Peça ao operador para gerar um novo QR Code.</p>

    {% else %}
      <div class="icon">📷</div>
      <h1>Enviar foto</h1>
      <p>Toque no botão abaixo para escolher uma foto da galeria ou abrir a câmera.</p>

      <img id="preview" alt="Pré-visualização">
      <input type="file" id="fileInput" accept="image/*">
      <button class="btn btn-primary" id="btnCamera" onclick="document.getElementById('fileInput').click()">
        Tirar foto ou abrir galeria
      </button>
      <div id="status"></div>
    {% endif %}

  </div>

  {% if not expirada %}
  <script>
    const UPLOAD_URL = "{{ upload_url }}";
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const btnCamera = document.getElementById('btnCamera');

    fileInput.addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;

      // pré-visualização
      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);

      // upload
      btnCamera.disabled = true;
      btnCamera.textContent = 'Enviando…';
      btnCamera.className = 'btn btn-disabled';
      statusEl.style.display = 'none';

      const form = new FormData();
      form.append('foto', file);

      fetch(UPLOAD_URL, { method: 'POST', body: form })
        .then(r => r.json())
        .then(data => {
          if (data.ok) {
            statusEl.textContent = '✅ Foto enviada com sucesso!';
            statusEl.className = 'status-ok';
            btnCamera.textContent = 'Enviar outra foto';
            btnCamera.className = 'btn btn-primary';
            btnCamera.disabled = false;
          } else {
            throw new Error(data.erro || 'Erro desconhecido.');
          }
        })
        .catch(err => {
          statusEl.textContent = '❌ ' + err.message;
          statusEl.className = 'status-erro';
          btnCamera.textContent = 'Tentar novamente';
          btnCamera.className = 'btn btn-primary';
          btnCamera.disabled = false;
        })
        .finally(() => {
          statusEl.style.display = 'block';
        });
    });
  </script>
  {% endif %}
</body>
</html>
