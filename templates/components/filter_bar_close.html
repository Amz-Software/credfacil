      <div class="col-12 col-md-auto d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bx bx-filter-alt me-1"></i>{{ submit_label|default:'Filtrar' }}</button>
        {% if clear_url %}<a href="{{ clear_url }}" class="btn btn-outline-secondary"><i class="bx bx-x me-1"></i>Limpar</a>{% endif %}
      </div>
    </div>
  </div>
</form>
