{% load iam_tags %}
      {% if not hide_actions %}
      <div class="d-flex flex-wrap gap-2 mt-4">
        {% if submit_perm %}
          {% if user|has_perm:submit_perm %}<button type="submit" class="btn btn-primary"><i class="bx bx-save me-1"></i>{{ submit_label|default:'Salvar' }}</button>{% endif %}
        {% else %}
          <button type="submit" class="btn btn-primary"><i class="bx bx-save me-1"></i>{{ submit_label|default:'Salvar' }}</button>
        {% endif %}
        {% if cancel_url %}<a href="{{ cancel_url }}" class="btn btn-outline-secondary">{{ cancel_label|default:'Cancelar' }}</a>{% endif %}
      </div>
      {% endif %}
    </form>
  </div>
</div>
