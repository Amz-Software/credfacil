name: Deploy automático

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            bash -e <<'DEPLOY_EOF'
            set -e

            APP_DIR="/root/credfacil"
            SERVICE="web"
            HEALTH_URL="http://localhost:8010/"
            HEALTHCHECK_TRIES=180   # 180 * 2s = 6min (collectstatic é lento)

            cd "$APP_DIR"

            echo "==> [1] Pré-checagem"
            git status --porcelain || true
            CURRENT_SHA=$(git rev-parse HEAD)
            git fetch --quiet origin main
            NEW_SHA=$(git rev-parse origin/main)
            echo "==> [2] HEAD=$CURRENT_SHA  REMOTE=$NEW_SHA"

            if [ "$CURRENT_SHA" = "$NEW_SHA" ]; then
              echo "==> Nada novo. Saindo sem tocar no PRD."
              exit 0
            fi

            echo "==> [3] Diff de arquivos"
            CHANGED_FILES=$(git diff --name-only "$CURRENT_SHA" "$NEW_SHA")
            printf '%s\n' "$CHANGED_FILES"

            NEEDS_REBUILD=false
            if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(Dockerfile|requirements\.txt|docker-compose\.ya?ml)$'; then
              NEEDS_REBUILD=true
            fi
            echo "==> [4] NEEDS_REBUILD=$NEEDS_REBUILD"

            echo "==> [5] git merge --ff-only"
            git merge --ff-only origin/main
            echo "==> [6] merge ok ($(git rev-parse --short HEAD))"

            if [ "$NEEDS_REBUILD" = "true" ]; then
              echo "==> [7a] rebuild da imagem $SERVICE"
              docker compose build "$SERVICE"
              docker compose up -d --no-deps "$SERVICE"
            else
              echo "==> [7b] restart do $SERVICE"
              docker compose restart "$SERVICE"
            fi
            echo "==> [8] swap de container ok"

            echo "==> [9] Healthcheck (até $((HEALTHCHECK_TRIES * 2))s — boot inclui collectstatic)"
            ok=0
            i=0
            while [ "$i" -lt "$HEALTHCHECK_TRIES" ]; do
              i=$((i + 1))
              code=$(curl -s -o /dev/null --max-time 5 -w '%{http_code}' "$HEALTH_URL" 2>/dev/null || true)
              if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ]; then
                echo "==> [10] OK ($code) na tentativa $i (~$((i * 2))s)"
                ok=1
                break
              fi
              # log periódico a cada 30s
              if [ $((i % 15)) -eq 0 ]; then
                echo "    ainda subindo... tentativa $i (~$((i * 2))s) último code=${code:-vazio}"
              fi
              sleep 2
            done

            docker compose ps "$SERVICE" || true

            if [ "$ok" != "1" ]; then
              echo "!! Healthcheck falhou após $((HEALTHCHECK_TRIES * 2))s — últimos logs:"
              docker compose logs --tail=120 "$SERVICE" || true
              exit 1
            fi
            DEPLOY_EOF
