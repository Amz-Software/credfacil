name: Deploy automático

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-apenas-para-testes
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DB_USED: sqlite
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependências Python
        run: pip install -r requirements.txt

      - name: Testes
        run: python manage.py test

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            bash -e <<'DEPLOY_EOF'
            set -e

            APP_DIR="/root/credfacil"
            SERVICE="web"
            HEALTH_URL="http://localhost:8010/healthz/"
            HEALTHCHECK_TRIES=60    # 60 * 2s = 2min (boot sem migrate/collectstatic)

            cd "$APP_DIR"

            echo "==> [1] Pré-checagem"
            git status --porcelain || true
            CURRENT_SHA=$(git rev-parse HEAD)
            git fetch --quiet origin main
            NEW_SHA=$(git rev-parse origin/main)
            echo "==> [2] HEAD=$CURRENT_SHA  REMOTE=$NEW_SHA"

            if [ "$CURRENT_SHA" = "$NEW_SHA" ]; then
              echo "==> Nada novo. Saindo sem tocar no PRD."
              exit 0
            fi

            echo "==> [3] Diff de arquivos"
            CHANGED_FILES=$(git diff --name-only "$CURRENT_SHA" "$NEW_SHA")
            printf '%s\n' "$CHANGED_FILES"

            NEEDS_REBUILD=false
            if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(Dockerfile|requirements\.txt|docker-compose\.ya?ml)$'; then
              NEEDS_REBUILD=true
            fi
            echo "==> [4] NEEDS_REBUILD=$NEEDS_REBUILD"

            echo "==> [5] git merge --ff-only"
            git merge --ff-only origin/main
            echo "==> [6] merge ok ($(git rev-parse --short HEAD))"

            if [ "$NEEDS_REBUILD" = "true" ]; then
              echo "==> [7] rebuild da imagem $SERVICE"
              docker compose build "$SERVICE"
            fi

            # Migrate/collectstatic num container avulso, com o site antigo ainda
            # no ar (collectstatic leva ~2min). autoheal=false: o container avulso
            # herda o healthcheck do serviço e não pode ser reiniciado no meio.
            echo "==> [8] migrate + collectstatic (site segue no ar)"
            # DB_*_TIMEOUT=0: um ALTER TABLE longo não pode ser cortado no meio.
            # </dev/null: este script chega ao bash pelo stdin (heredoc); sem
            # isso o `compose run` consome o resto do script e o deploy termina
            # "com sucesso" sem reiniciar nada (aconteceu em 2026-11-13).
            docker compose run --rm --no-deps -T -l autoheal=false \
              -e DB_READ_TIMEOUT=0 -e DB_WRITE_TIMEOUT=0 "$SERVICE" \
              sh -c "python3 manage.py migrate --noinput && python3 manage.py collectstatic --noinput" \
              </dev/null

            if [ "$NEEDS_REBUILD" = "true" ]; then
              echo "==> [9a] recriando containers alterados (web, autoheal)"
              docker compose up -d
            else
              echo "==> [9b] restart do $SERVICE e do crm-worker"
              docker compose restart "$SERVICE"
              docker compose up -d --no-deps crm-worker
              docker compose restart crm-worker
            fi
            echo "==> [10] swap de container ok"

            echo "==> [11] Healthcheck (até $((HEALTHCHECK_TRIES * 2))s)"
            ok=0
            i=0
            while [ "$i" -lt "$HEALTHCHECK_TRIES" ]; do
              i=$((i + 1))
              code=$(curl -s -o /dev/null --max-time 5 -w '%{http_code}' "$HEALTH_URL" 2>/dev/null || true)
              if [ "$code" = "200" ]; then
                echo "==> [12] OK ($code) na tentativa $i (~$((i * 2))s)"
                ok=1
                break
              fi
              # log periódico a cada 30s
              if [ $((i % 15)) -eq 0 ]; then
                echo "    ainda subindo... tentativa $i (~$((i * 2))s) último code=${code:-vazio}"
              fi
              sleep 2
            done

            docker compose ps "$SERVICE" || true

            if [ "$ok" != "1" ]; then
              echo "!! Healthcheck falhou após $((HEALTHCHECK_TRIES * 2))s — últimos logs:"
              docker compose logs --tail=120 "$SERVICE" || true
              exit 1
            fi
            DEPLOY_EOF
