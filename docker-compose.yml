services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: credfacil-web:latest
    volumes:
      - .:/app
      - ./static:/app/static
      - ./mediafiles:/app/mediafiles
    # migrate/collectstatic rodam no deploy (deploy.yml), não no boot: assim um
    # restart sobe em segundos em vez de ~2 min. Ver gunicorn.conf.py.
    command: gunicorn core.asgi:application -c gunicorn.conf.py
    restart: always
    stop_grace_period: 35s  # > graceful_timeout do gunicorn (30s)
    # 8010 publicada no host: o nginx do servidor faz proxy para ela. Ver
    # docs/DEPLOY_SEGURANCA.md (bloquear 8010 no firewall para fora do host).
    ports:
      - '8010:8010'
    networks:
      - mynetwork
    depends_on:
      - redis
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Rotinas do CRM de WhatsApp (programadas, lembretes, mídias, aberturas), a cada
  # minuto. Mesma imagem e código do web; sem porta exposta.
  crm-worker:
    image: credfacil-web:latest
    # O .env é lido pelo load_dotenv() das settings, como no web.
    volumes:
      - .:/app
      - ./mediafiles:/app/mediafiles
    command: python manage.py crm_rotinas --loop
    restart: always
    stop_grace_period: 15s
    networks:
      - mynetwork
    depends_on:
      - web
      - redis

  # Reinicia containers com label autoheal=true que fiquem "unhealthy"
  # (rede de segurança além do watchdog de workers do gunicorn).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: always
    network_mode: none
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Redis só na rede interna do compose (sem porta no host) e com senha.
  # REDIS_PASSWORD vem do .env (o compose lê o .env da pasta para interpolar).
  redis:
    image: redis:7
    restart: always
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    networks:
      - mynetwork

networks:
  mynetwork:
