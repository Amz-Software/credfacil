{% extends "base.html" %}
{% load static iam_tags %}
{% block title %}
Detalhes do Parcelamento
{% endblock title %}

{% block content %}

<div class="container-xxl mt-4">
  <div class="row">
    <div class="col-12">
      <div class="container-xxl flex-grow-1 container-p-y">
        <h4 class="py-3 mb-4">
          <span class="text-muted fw-light">
            <a href="{% url 'produtos:parcelamentos' %}" class="text-muted">Parcelamentos</a> /
          </span> Detalhes
        </h4>
        <div class="row">
          <div class="col-xl-6">
            <div class="card mb-4">
              <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Parcelamento (iPhone)</h5>
                <div class="d-flex gap-2">
                  {% if user|has_perm:"produtos.change_parcelamento" %}
                  <a href="{% url 'produtos:parcelamento_update' parcelamento.id %}" class="btn btn-sm btn-outline-primary">
                    <i class="bx bx-edit-alt me-1"></i> Editar
                  </a>
                  {% endif %}
                </div>
              </div>
              <div class="card-body">
                {{ form.as_p }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
