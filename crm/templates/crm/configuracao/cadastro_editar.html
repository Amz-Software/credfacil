{% extends "crm/configuracao/base.html" %}
{% block aba %}
<div class="row">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header"><h5 class="mb-0">Editar {{ config.singular }}</h5></div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% for campo in form %}{% include "crm/configuracao/_campo.html" %}{% endfor %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bx bx-save me-1"></i>Salvar</button>
            <a href="{% url 'crm:cadastro_lista' tipo %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
        <p class="small text-muted mt-3 mb-0">Para tirar de uso sem perder o histórico, desmarque “Ativo”.</p>
      </div>
    </div>
  </div>
</div>
{% endblock aba %}
