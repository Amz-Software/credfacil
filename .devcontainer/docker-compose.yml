version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspaces:cached
      - ~/.ssh:/root/.ssh:cached
      # NÃO monte ~/.vscode-server do host: os binários são específicos de SO
      # (macOS x Linux) e os sockets/IPC não funcionam sobre o bind mount do
      # Docker no macOS, causando loop de ECONNREFUSED no Extension Host.
      # O VS Code instala o servidor dentro do container automaticamente.

    # Uncomment the next four lines if you will use a ptrace-based debugger like C++, Go, and Rust.
    # cap_add:
    #   - SYS_PTRACE
    # security_opt:
    #   - seccomp:unconfined

    command: /bin/zsh -c "while sleep 1000; do :; done"
    ports:
      - "8060:8060"
