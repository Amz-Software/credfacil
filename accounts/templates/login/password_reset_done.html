{% extends 'base_login.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <div class="col-md-6">
    <div class="authentication-inner">
      <div class="card">
        <div class="card-body text-center">
          <h4 class="mb-2">Verifique seu e-mail <i class="bx bx-envelope"></i></h4>
          <p class="mb-4">
            Se o e-mail informado estiver cadastrado, você vai receber um link para definir uma nova senha.
            O link vale por pouco tempo; confira também a caixa de spam.
          </p>
          <a href="{% url 'accounts:login' %}" class="btn btn-primary d-grid w-100">Voltar ao login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
